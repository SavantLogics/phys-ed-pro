<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhysEd Pro v3.0 — Browser Test Suite</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
  .pass { color: #2ecc71; } .fail { color: #e74c3c; } .skip { color: #f39c12; }
  .section { color: #f39c12; font-weight: bold; margin-top: 16px; }
  #summary { margin-top: 20px; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; }
  #summary.all-pass { background: #1a4a2e; color: #2ecc71; }
  #summary.has-fail { background: #4a1a1a; color: #e74c3c; }
</style>
</head>
<body>
<h1>PhysEd Pro v3.0 — Browser Test Suite</h1>
<p>Tests the SAME logic.js / storage.js files the app runs (no copied code, no drift).
Storage tests use a separate IndexedDB (<code>physed_pro_test</code>) — your real data is untouched.</p>
<pre id="output"></pre>
<div id="summary"></div>

<script>window.PHYSED_DB_NAME = 'physed_pro_test';</script>
<script src="./logic.js"></script>
<script src="./storage.js"></script>
<script>
const out = document.getElementById('output');
let pass = 0, fail = 0, skip = 0;
function log(cls, msg) { out.innerHTML += `<span class="${cls}">${msg}</span>\n`; }
function eq(actual, expected, label) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a === e) { pass++; log('pass', `  PASS  ${label}`); }
  else { fail++; log('fail', `  FAIL  ${label}\n        expected ${e}\n        actual   ${a}`); }
}
function section(name) { log('section', `\n== ${name} ==`); }

function settingsWith(over = {}) {
  return Object.assign({
    weeklyTotal: 100,
    codes: DEFAULT_CODES.map(c => ({ ...c, flags: { ...c.flags } })),
    thresholds: { ...DEFAULT_THRESHOLDS },
  }, over);
}
const MON = new Date(2026, 5, 8);
const WEEK = getWeekDates(MON);
function codesByDate(list) {
  const m = {};
  list.forEach((c, i) => { if (c) m[dateKey(WEEK[i])] = c; });
  return m;
}

async function runLogicTests() {
  section('Dates');
  eq(dateKey(new Date(2026, 5, 8)), '2026-06-08', 'dateKey is local');
  eq(dateKey(getMonday(new Date(2026, 5, 14))), '2026-06-08', 'getMonday from Sunday');
  eq(WEEK.length, 10, '10-day window');
  eq(dateKey(WEEK[5]), '2026-06-15', 'week 2 skips weekend');

  section('Points');
  const S = settingsWith();
  eq(calcPoints(codesByDate([]), WEEK, S), 100, 'no codes = full points');
  eq(calcPoints(codesByDate(['A']), WEEK, S), 90, 'A deducts 10');
  eq(calcPoints(codesByDate(['A','A']), WEEK, settingsWith({ weeklyTotal: 10 })), 0, 'floors at 0');
  eq(effectivePoints(90, 75), 75, 'override wins');
  eq(effectivePoints(90, 0), 0, 'override of 0 respected');

  section('Comment ladder');
  eq(calcComment(codesByDate(['EX','A','A']), WEEK, S),
    'Multiple unexcused absences this week affected the grade. Consistent attendance is needed.',
    'EX never masks absences');
  eq(calcComment(codesByDate([]), WEEK, S),
    'Excellent week — full participation, dressed out, and on time. Keep it up!', 'clean week positive');
  eq(ladderComment(weeklyStats(codesByDate(['T']), WEEK, S), S.thresholds).rule, 11, 'single tardy -> solid, not excellent');
  eq(ladderComment(weeklyStats(codesByDate(['NP']), WEEK, S), S.thresholds).rule, 5, 'NP combo: participation outranks dress');

  // Shared cases table (needs http(s); file:// blocks fetch)
  try {
    const resp = await fetch('./tests/cases.json');
    const table = (await resp.json()).cases;
    section(`Shared cases table (${table.length} cases)`);
    for (const c of table) {
      const cfg = settingsWith();
      if (c.weeklyTotal) cfg.weeklyTotal = c.weeklyTotal;
      if (c.thresholds) cfg.thresholds = Object.assign({ ...DEFAULT_THRESHOLDS }, c.thresholds);
      if (c.extraCodes) cfg.codes = cfg.codes.concat(c.extraCodes);
      const r = ladderComment(weeklyStats(codesByDate(c.codes), WEEK, cfg), cfg.thresholds);
      eq(r.rule, c.expectRule, `${c.name} -> rule ${c.expectRule}`);
    }
  } catch (e) {
    skip++; log('skip', `  SKIP  shared cases table (open tests.html via a local server to include it: ${e.message})`);
  }

  section('CSV');
  const sample = 'Student,ID,SIS User ID,SIS Login ID,Section,HW\n"    Points Possible",,,,,100\n"Doe, Jane",1001,S1,jd,Period 1,9';
  eq(parseCSV(sample).length, 1, 'skips Points Possible row');
  eq(parseCSVLine('a,"b,c",d'), ['a','b,c','d'], 'quoted comma');
  const exp = buildCanvasExportCSV([{student:'Doe, Jane',id:'1001',sisUserId:'',sisLoginId:'',section:'Period 1',points:95,matched:true}], 'PE Wk', 100);
  eq(exp.split('\n')[1], '    Points Possible,,,,,100', 'export has Points Possible row');
}

function safeLS() { try { return window.localStorage; } catch (e) { return null; } }

async function runStorageTests() {
  section('IndexedDB storage (test DB)');
  // fresh DB
  await new Promise((res) => { const r = indexedDB.deleteDatabase('physed_pro_test'); r.onsuccess = r.onerror = r.onblocked = () => res(); });
  // protect any real localStorage values on this origin
  const ls = safeLS();
  const savedBlob = ls ? ls.getItem('physed_pro_data') : null;
  const savedFlag = ls ? ls.getItem('physed_pro_migrated_v3') : null;
  try {
    if (ls) {
      // seed a fake v2 blob and force migration
      ls.removeItem('physed_pro_migrated_v3');
      ls.setItem('physed_pro_data', JSON.stringify({
        students: [{ id: 7, name: 'Migrated Kid', sid: '777', period: 2 }],
        entries: { '7_2026-06-08': { studentId: 7, period: 2, date: '2026-06-08', code: 'A' } },
        settings: { main: { key: 'main', value: { weeklyTotal: 90, codes: [] } } },
        _nextId: 8,
      }));
    }
    await openDB();
    if (ls) {
      const migrated = await dbGetAll('students');
      eq(migrated.length, 1, 'v2 localStorage migrated: student count');
      eq(migrated[0].name, 'Migrated Kid', 'v2 migration preserves fields');
      eq((await dbGet('entries', '7_2026-06-08')).code, 'A', 'v2 migration preserves entries');
      eq((await dbGet('settings', 'main')).value.weeklyTotal, 90, 'v2 migration preserves settings');
      eq(ls.getItem('physed_pro_migrated_v3'), '1', 'migration flag set');
    } else {
      skip++; log('skip', '  SKIP  v2 migration tests (localStorage unavailable on this origin)');
    }

    // CRUD
    const sid = await dbPut('students', { name: 'New Kid', sid: '123', period: 1 });
    eq(typeof sid, 'number', 'autoIncrement id assigned');
    eq((await dbGet('students', sid)).name, 'New Kid', 'get by key');
    eq((await dbGetByIndex('students', 'period', 1)).length, 1, 'index: period 1');
    if (ls) eq((await dbGetByIndex('students', 'period', 2)).length, 1, 'index: period 2 (migrated)');
    await dbPut('entries', { id: `${sid}_2026-06-09`, studentId: sid, period: 1, date: '2026-06-09', code: 'NP' });
    eq((await dbGetByIndex('entries', 'studentId', sid)).length, 1, 'entries by studentId index');
    await dbPut('overrides', { id: `${sid}_2026-06-08`, studentId: sid, weekKey: '2026-06-08', pts: 80, comment: 'custom' });
    eq((await dbGetByIndex('overrides', 'weekKey', '2026-06-08')).length, 1, 'overrides by weekKey index');

    // backup round trip
    const expectCount = ls ? 2 : 1;
    const backup = await exportBackupJSON();
    eq(backup.students.length, expectCount, 'backup contains students');
    await dbClear('students');
    eq((await dbGetAll('students')).length, 0, 'dbClear works');
    await restoreBackupJSON(backup);
    eq((await dbGetAll('students')).length, expectCount, 'restore round trip');
    eq((await dbGet('overrides', `${sid}_2026-06-08`)).pts, 80, 'restore preserves overrides');

    await dbDelete('students', sid);
    eq(await dbGet('students', sid), undefined, 'dbDelete works');

    // backup-to-handle (mock File System Access handle)
    let written = null;
    const mockHandle = { name: 'mock.json', createWritable: async () => ({ write: async s => { written = s; }, close: async () => {} }) };
    await saveBackupToHandle(mockHandle);
    eq(JSON.parse(written).app, 'PhysEd Pro', 'saveBackupToHandle writes valid backup');
    eq(isBackupStale(null, Date.now()), true, 'isBackupStale: never -> stale');
    eq(isBackupStale(new Date().toISOString(), Date.now()), false, 'isBackupStale: just now -> fresh');
  } finally {
    // restore the real origin localStorage exactly as it was
    if (ls) {
      if (savedBlob === null) ls.removeItem('physed_pro_data'); else ls.setItem('physed_pro_data', savedBlob);
      if (savedFlag === null) ls.removeItem('physed_pro_migrated_v3'); else ls.setItem('physed_pro_migrated_v3', savedFlag);
    }
    indexedDB.deleteDatabase('physed_pro_test');
  }
}

(async () => {
  try {
    await runLogicTests();
    await runStorageTests();
  } catch (e) {
    fail++; log('fail', `  FAIL  unexpected error: ${e.message}\n${e.stack}`);
  }
  const summary = document.getElementById('summary');
  summary.textContent = `${pass} passed, ${fail} failed${skip ? `, ${skip} skipped` : ''}`;
  summary.className = fail ? 'has-fail' : 'all-pass';
  document.title = (fail ? 'FAIL — ' : 'PASS — ') + document.title;
})();
</script>
</body>
</html>
